services:
  - type: web
    name: bazi-reading-api
    env: node
    plan: starter
    buildCommand: npm install && npm install -g tsx && npx vite build
    startCommand: npx tsx api/server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bazi-db
          property: connectionString
